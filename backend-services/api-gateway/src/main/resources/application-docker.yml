server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: WARN

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: qa-service
          uri: http://qa-service:8082
          predicates:
            - Path=/api/qa/**
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/user/**
        # Swagger 聚合路由
        - id: swagger-user
          uri: http://user-service:8081
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs
        - id: swagger-qa
          uri: http://qa-service:8082
          predicates:
            - Path=/v3/api-docs/qa
          filters:
            - RewritePath=/v3/api-docs/qa, /v3/api-docs
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

