server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: WARN

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: qa-service
          uri: http://qa-service:8082
          predicates:
            - Path=/api/qa/**
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/user/**
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

