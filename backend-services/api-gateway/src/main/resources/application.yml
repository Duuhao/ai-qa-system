server:
  port: 8080 # 所有后端请求的入口

logging:
  level:
    # Gateway日志
    org.springframework.cloud.gateway: DEBUG
    # 网络日志
    reactor.netty.http.client: DEBUG

# JWT 配置
jwt:
  secret: "mySecretKey123456789"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # QA Service 路由
        - id: qa-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/qa/**
        # User Service 路由  
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/**
        # Swagger 聚合路由（将 /v3/api-docs/{service} 转发到各服务的 /v3/api-docs）
        - id: swagger-user
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs
        - id: swagger-qa
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/qa
          filters:
            - RewritePath=/v3/api-docs/qa, /v3/api-docs
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# Springdoc Swagger UI 聚合配置（Gateway）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    urls:
      - name: user
        url: /v3/api-docs/user
      - name: qa
        url: /v3/api-docs/qa