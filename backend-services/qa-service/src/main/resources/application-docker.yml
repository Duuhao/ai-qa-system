server:
  port: 8082

spring:
  application:
    name: qa-service
  cloud:
    nacos:
      discovery:
        enabled: false  # 禁用服务发现
      config:
        enabled: false  # 禁用配置中心
  datasource:
    url: jdbc:mysql://mysql:3306/ai_qa_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ai_qa_system
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    com.ai.qa.qaservice.feign: DEBUG
    com.ai.qa.service.infrastructure.ai: DEBUG

# DeepSeek AI 配置
deepseek:
  ai:
    api-key: sk-807a0b59ed5f45d9812567e82db4e6c1
    model: deepseek-chat
