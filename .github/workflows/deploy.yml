name: CI/CD Pipeline

on:
  push:
    branches: [ ai-qa-system-cicd ]
  pull_request:
    branches: [ ai-qa-system-cicd ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push API Gateway image
      run: |
        docker build -f Dockerfile.api-gateway -t $ECR_REGISTRY/duuhao/ai-qa-system/api-gateway:$IMAGE_TAG .
        docker push $ECR_REGISTRY/duuhao/ai-qa-system/api-gateway:$IMAGE_TAG

    - name: Build, tag, and push QA Service image
      run: |
        docker build -f Dockerfile.qa-service -t $ECR_REGISTRY/duuhao/ai-qa-system/qa-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/duuhao/ai-qa-system/qa-service:$IMAGE_TAG

    - name: Build, tag, and push User Service image
      run: |
        docker build -f Dockerfile.user-service -t $ECR_REGISTRY/duuhao/ai-qa-system/user-service:$IMAGE_TAG .
        docker push $ECR_REGISTRY/duuhao/ai-qa-system/user-service:$IMAGE_TAG

    - name: Build, tag, and push Frontend image
      run: |
        docker build -f Dockerfile.frontend -t $ECR_REGISTRY/duuhao/ai-qa-system/frontend:$IMAGE_TAG .
        docker push $ECR_REGISTRY/duuhao/ai-qa-system/frontend:$IMAGE_TAG

    - name: Copy deployment script to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "deploy-to-ec2.sh"
        target: "/home/${{ secrets.EC2_USER }}/"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 设置环境变量
          export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}

          # 确保用户家目录存在
          mkdir -p /home/${{ secrets.EC2_USER }}

          # 确保部署脚本在绝对路径存在并可执行
          chmod +x /home/${{ secrets.EC2_USER }}/deploy-to-ec2.sh || true

          # 在脚本中执行完整部署逻辑（脚本内部会处理目录与工具安装）
          /home/${{ secrets.EC2_USER }}/deploy-to-ec2.sh ${{ github.sha }}
